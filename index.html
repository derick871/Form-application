<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalized Portal</title>
    <link rel="stylesheet" href="cookies.css">
</head>
<body>

    <main class="container">
        <!-- Input Section -->
        <section class="card">
            <h2>User Registration</h2>
            <form id="userForm">
                <label for="username">Name</label>
                <input type="text" id="username" placeholder="Enter your name" required>
                
                <label for="age">Age</label>
                <input type="number" id="age" placeholder="Enter your age" required>
                
                <button type="submit" id="btn">Save Profile</button>
            </form>
        </section>

        <section id="displaySection" class="card" style="display:none;">
            <div id="greetingSlot"></div>
            <div id="ageStatusSlot"></div>
            <div id="monthsSlot"></div>
            <hr>
            <h3>Daily Motivation</h3>
            <div id="quoteSlot"></div>
        </section>
    </main>

    <script src="cookies.js"></script>
</body>
</html>
